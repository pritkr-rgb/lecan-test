<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecan Online Assessment</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;text-align:center;padding:60px 16px;color:#0E3B43">
<div id="m">Loading test page…</div>
<script>
// Loads the latest test page from the Lecan Google Apps Script (results stay in the Google Sheet).
var API = 'https://script.google.com/macros/s/AKfycbw1UiesrzSxy7rkXPR86WHc3jhhPNUGD0ANMLx0KayRu-HWNArgWkO7sC31CRdJcNoB/exec';
function load(n) {
  fetch(API + '?raw=1&t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (h) { if (h.indexOf('Lecan Online Assessment') < 0) throw new Error('bad page'); document.open(); document.write(h); document.close(); })
    .catch(function () {
      if (n < 3) return setTimeout(function () { load(n + 1); }, 2000);
      document.getElementById('m').innerHTML = 'Could not load the test. Check your internet and <a href="">refresh</a> the page.';
    });
}
load(0);
</script></body></html>
